name: Markdown Lint

on:
  push:
    paths:
      - '**/*.md'
      - .markdownlint.yaml
  pull_request:
    paths:
      - '**/*.md'
      - .markdownlint.yaml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
