[tox]
envlist = py314,ruff-check

[testenv]
runner = uv-venv-lock-runner
extras = test
commands = pytest exordos_usage/tests/unit {posargs}

[testenv:functional]
extras = test
pass_env = USAGE_TEST_DSN
commands = pytest exordos_usage/tests/functional {posargs}

[testenv:ruff-check]
extras = test
commands =
    ruff check .
    ruff format --check .

[testenv:openapi_artifacts]
commands = exordos-usage-openapi-spec
