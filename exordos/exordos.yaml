build:
  deps:
    - dst: /opt/exordos_usage
      path:
        src: ../../exordos_usage
      exclude:
        - .venv
        - .tox
        - .pytest_cache
        - .ruff_cache
        - __pycache__
        - output
  elements:
    - manifest: manifests/usage.yaml.j2
      artifacts:
        - script: images/build_openapi_spec.sh
          artifacts:
            - ../docs/openapi/openapi_user.yaml
      images:
        - name: usage
          format: zst
          profile: exordos_base
          script: images/cp_install.sh
          override:
            disk_size: "6G"
